# Só para desenvolvimento local. Em produção o banco é o Aurora DSQL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chicken
      POSTGRES_PASSWORD: chicken
      POSTGRES_DB: chicken
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chicken"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
