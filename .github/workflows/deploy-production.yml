name: deploy-production

# Merge em main publica em produção, depois da aprovação manual do environment production. Não roda em pull requests.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@65.17.0
  # Endereço público do ambiente (sem segredo); troque aqui ao ganhar domínio próprio.
  API_URL: https://avitech-api-production.vercel.app

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7.0.1
      - name: Instalar o pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: api/package.json
      - name: Instalar o Node 22 com cache
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Instalar dependências da API (lockfile congelado)
        working-directory: api
        run: pnpm install --frozen-lockfile
      - name: Aplicar as migrações no banco de produção
        working-directory: api
        run: pnpm db:deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # A API vai antes do front-end: se o contrato mudou, o front novo nunca
      # encontra uma API antiga.
      - name: Baixar a configuração do projeto da API na Vercel
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
      - name: Build da API
        run: pnpm dlx "$VERCEL_CLI" build --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
      - name: Publicar a API em produção
        run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

      - name: Health check da API (precisa responder 200)
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --retry 6 --retry-delay 5 --retry-all-errors --max-time 15 \
            "$API_URL/api/health")
          echo "GET /api/health -> $status"
          test "$status" = "200"

      - name: Limpar a configuração baixada da API
        run: rm -rf .vercel
      - name: Baixar a configuração do projeto do front-end na Vercel
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
      - name: Build do front-end
        run: pnpm dlx "$VERCEL_CLI" build --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
      - name: Publicar o front-end em produção
        run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
