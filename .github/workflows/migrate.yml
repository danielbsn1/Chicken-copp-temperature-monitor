name: migrate

# A Vercel publica a API e o painel pela integração Git. Este workflow cuida só
# das migrações do banco: merge em development migra o staging; merge em main
# migra a produção depois da aprovação do environment production.
# Não roda em pull requests.
on:
  push:
    branches: [development, main]

permissions:
  contents: read

env:
  # Endereços públicos dos ambientes (sem segredo); troque aqui ao ganhar domínio próprio.
  STAGING_API_URL: https://avitech-api-staging.vercel.app
  PRODUCTION_API_URL: https://avitech-api-production.vercel.app

jobs:
  staging:
    name: migrate staging
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: migrate-staging
      cancel-in-progress: false
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7.0.1
      - name: Instalar o pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: api/package.json
      - name: Instalar o Node 22 com cache
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Instalar dependências da API (lockfile congelado)
        working-directory: api
        run: pnpm install --frozen-lockfile
      - name: Mascarar partes da conexão nos logs
        run: .github/scripts/mask-connection.sh
        env:
          CONNECTION_URL: ${{ secrets.DIRECT_URL }}
      - name: Aplicar as migrações no banco do staging
        working-directory: api
        run: pnpm db:deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Health check do staging (precisa responder 200)
        run: .github/scripts/health-check.sh
        env:
          HEALTH_URL: ${{ env.STAGING_API_URL }}/api/health

  production:
    name: migrate production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7.0.1
      - name: Instalar o pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: api/package.json
      - name: Instalar o Node 22 com cache
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Instalar dependências da API (lockfile congelado)
        working-directory: api
        run: pnpm install --frozen-lockfile
      - name: Mascarar partes da conexão nos logs
        run: .github/scripts/mask-connection.sh
        env:
          CONNECTION_URL: ${{ secrets.DIRECT_URL }}
      - name: Aplicar as migrações no banco de produção
        working-directory: api
        run: pnpm db:deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Health check da produção (precisa responder 200)
        run: .github/scripts/health-check.sh
        env:
          HEALTH_URL: ${{ env.PRODUCTION_API_URL }}/api/health
